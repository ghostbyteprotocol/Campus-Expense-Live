<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Campus Expense Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0914;
      --surface: #151226;
      --surface-2: #1f1b36;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #f59e0b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    body.light-mode {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #e2e8f0;
      --border: rgba(15, 23, 42, 0.1);
      --primary: #d97706;
      --accent: #7c3aed;
      --text: #0f172a;
      --muted: #475569;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 14px 14px 36px;
      min-height: 100vh;
      transition: background 0.25s, color 0.25s;
    }
    .container { max-width: 780px; margin: 0 auto; }

    /* Top Bar */
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px;
      margin-bottom: 14px; position: sticky; top: 10px; z-index: 50;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    }
    .brand { display: flex; align-items: center; gap: 11px; user-select: none; }
    .logo-box {
      width: 40px; height: 40px; border-radius: 13px;
      background: linear-gradient(135deg, #f59e0b, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; color: #fff; font-weight: 800;
      flex-shrink: 0;
    }
    .app-name { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700; }
    .student-tag { font-size: 11px; font-weight: 700; color: var(--primary); margin-top: 1px; }
    .app-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

    .theme-btn {
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); padding: 8px 13px; border-radius: 12px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }

    /* Summary Card */
    .hero {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 22px; padding: 18px; margin-bottom: 14px;
    }
    .hero-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
    .lbl-sm { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 700; }
    .big-num { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; color: var(--primary); margin-top: 2px; }
    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .kpi {
      background: var(--surface-2); border-radius: 14px; padding: 10px;
    }
    .kpi span { display: block; font-size: 10px; color: var(--muted); font-weight: 600; }
    .kpi strong { font-family: 'Outfit', sans-serif; font-size: 15px; margin-top: 3px; display: block; }

    /* Week Navigation */
    .week-nav {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); padding: 10px 12px; border-radius: 16px;
      border: 1px solid var(--border); margin-bottom: 12px; gap: 8px;
    }
    .nav-btn {
      background: var(--surface-2); color: var(--text); border: none;
      padding: 8px 13px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .current-wk-btn {
      background: rgba(139, 92, 246, 0.18);
      color: var(--accent);
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Read-Only Report Cards */
    .day-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 14px 16px; margin-bottom: 10px;
    }
    .day-head {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 9px; margin-bottom: 9px; border-bottom: 1px solid var(--border);
    }
    .day-date { font-weight: 700; font-size: 13px; }
    .day-total {
      background: rgba(245, 158, 11, 0.16); color: var(--primary);
      padding: 4px 10px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 14px;
    }
    .meal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 12px; }
    .meal-item { display: flex; justify-content: space-between; }
    .meal-lbl { color: var(--muted); font-weight: 600; }
    .meal-val { font-weight: 600; text-align: right; }
    .other-line {
      margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--border);
      font-size: 12px; display: flex; justify-content: space-between;
    }

    /* Hidden Admin Unlock Modal (5 Taps on Logo) */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      z-index: 9999; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 22px; padding: 20px; width: 100%; max-width: 340px; text-align: center;
    }
    .pin-inp {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); font-size: 18px;
      text-align: center; letter-spacing: 6px; margin: 12px 0; outline: none;
    }
    .btn-admin {
      width: 100%; padding: 11px; border-radius: 12px; border: none;
      background: #ef4444; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 8px;
    }
    .btn-close {
      width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <div class="brand" onclick="handleSecretTap()">
      <div class="logo-box">🎓</div>
      <div>
        <div class="app-name">Campus Expense Live</div>
        <div class="student-tag">Ayan Karmakar</div>
        <div class="app-sub" id="syncStatus">Syncing live report...</div>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️ Light</button>
  </div>

  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="lbl-sm">Selected Week Total</div>
        <div class="big-num" id="statTotal">₹0</div>
      </div>
      <div style="text-align:right;">
        <div class="lbl-sm">Daily Average</div>
        <div style="font-family:'Outfit',sans-serif; font-size:20px; font-weight:700;" id="statAvg">₹0</div>
      </div>
    </div>
    <div class="kpi-row">
      <div class="kpi">
        <span>Active Days</span>
        <strong id="statDays">0 Days</strong>
      </div>
      <div class="kpi">
        <span>Highest Day</span>
        <strong id="statMax">₹0</strong>
      </div>
      <div class="kpi">
        <span>This Month</span>
        <strong id="statMonth">₹0</strong>
      </div>
    </div>
  </div>

  <div class="week-nav">
    <button class="nav-btn" onclick="prevWeek()">← Prev</button>
    <div id="weekLabel" style="text-align:center; font-size:12px; font-weight:700;">Current Week</div>
    <button class="nav-btn" onclick="nextWeek()">Next →</button>
  </div>

  <div id="reportList">
    <div class="day-card" style="text-align:center; color:var(--muted); padding:24px;">Loading live expenses...</div>
  </div>
</div>

<!-- Hidden Admin Control Modal (Triggered by 5 rapid taps on Logo) -->
<div id="adminModal" class="modal-overlay">
  <div class="modal-box">
    <div style="font-family:'Outfit',sans-serif; font-weight:700; font-size:16px;">Admin Protection Control</div>
    <div style="font-size:11px; color:var(--muted); margin-top:4px;">Enter PIN to unlock uninstall protection</div>
    <input type="password" id="adminPinInput" class="pin-inp" maxlength="6" placeholder="••••">
    <button class="btn-admin" onclick="unlockUninstallProtection()">Disable Uninstall Block</button>
    <button class="btn-close" onclick="closeAdminModal()">Close</button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxY-HmehplAlhgq4RUmolx2HxsnuSJ1isHi3UTTuO_8FvsAdGgc8qEc-doefN6cTXNZ/exec";
  let rawData = [];
  let weekOffset = 0;
  let lastKnownDateKey = "";
  let tapCount = 0;
  let tapTimer = null;

  // Theme Switcher (Dark / Light)
  function applySavedTheme() {
    const mode = localStorage.getItem('report_theme') || 'dark';
    const isLight = mode === 'light';
    document.body.classList.toggle('light-mode', isLight);
    document.getElementById('themeBtn').innerText = isLight ? '🌙 Dark' : '☀️ Light';
  }

  function toggleTheme() {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('report_theme', isLight ? 'light' : 'dark');
    document.getElementById('themeBtn').innerText = isLight ? '🌙 Dark' : '☀️ Light';
  }

  // 5-Tap Secret Admin Control for Uninstall Unblock
  function handleSecretTap() {
    tapCount++;
    clearTimeout(tapTimer);
    if (tapCount >= 5) {
      tapCount = 0;
      document.getElementById('adminPinInput').value = '';
      document.getElementById('adminModal').style.display = 'flex';
    } else {
      tapTimer = setTimeout(() => { tapCount = 0; }, 1200);
    }
  }

  function closeAdminModal() {
    document.getElementById('adminModal').style.display = 'none';
  }

  function unlockUninstallProtection() {
    const pin = document.getElementById('adminPinInput').value.trim();
    if (pin === "2007") {
      closeAdminModal();
      if (window.AndroidBridge && window.AndroidBridge.disableDeviceAdmin) {
        window.AndroidBridge.disableDeviceAdmin();
      } else {
        alert("Protection disabled. You can now uninstall from Settings.");
      }
    } else {
      alert("Wrong PIN");
    }
  }

  function getTodayKey() {
    const now = new Date();
    return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
  }

  // Auto-sync week to current date whenever day/week changes
  function autoSyncWeekWithDate() {
    const todayKey = getTodayKey();
    if (lastKnownDateKey && lastKnownDateKey !== todayKey) {
      weekOffset = 0;
      renderReport();
    }
    lastKnownDateKey = todayKey;
  }

  function parseEntryDate(dateStr) {
    const datePart = String(dateStr || '').split(' ')[0];
    const parts = datePart.split('/');
    if (parts.length !== 3) return new Date(0);
    return new Date(parts[2], parts[1] - 1, parts[0]);
  }

  function getCalendarWeekRange(offset) {
    const now = new Date();
    const day = now.getDay();
    const diffToMon = now.getDate() - day + (day === 0 ? -6 : 1) + (offset * 7);
    const start = new Date(now.getFullYear(), now.getMonth(), diffToMon);
    start.setHours(0, 0, 0, 0);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    end.setHours(23, 59, 59, 999);
    return { start, end };
  }

  function formatDateShort(d) {
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }

  function prevWeek() { weekOffset--; renderReport(); }
  function nextWeek() { weekOffset++; renderReport(); }
  function goToCurrentWeek() { weekOffset = 0; renderReport(); }

  async function fetchLiveReport() {
    autoSyncWeekWithDate();
    try {
      const res = await fetch(API_URL);
      const allRows = await res.json();
      rawData = allRows.filter(r => r.date !== "__SYS_CMD__");
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
      const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('syncStatus').innerText = `Live • ${dateStr}, ${timeStr}`;
      renderReport();
    } catch (e) {
      document.getElementById('syncStatus').innerText = "Offline • Check Internet";
    }
  }

  function renderReport() {
    const list = document.getElementById('reportList');
    const range = getCalendarWeekRange(weekOffset);
    const rangeText = `${formatDateShort(range.start)} - ${formatDateShort(range.end)}`;

    if (weekOffset === 0) {
      document.getElementById('weekLabel').innerHTML = `Current Week<br><span style="font-size:10px; color:var(--muted);">${rangeText}</span>`;
    } else {
      document.getElementById('weekLabel').innerHTML = `
        <button class="current-wk-btn" onclick="goToCurrentWeek()">↺ Go to Current Week</button>
        <div style="font-size:10px; color:var(--muted); margin-top:3px;">${rangeText}</div>
      `;
    }

    const now = new Date();
    const monthTotal = rawData.reduce((acc, r) => {
      const d = parseEntryDate(r.date);
      return (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) ? acc + r.total : acc;
    }, 0);
    document.getElementById('statMonth').innerText = `₹${monthTotal}`;

    const rows = rawData.filter(r => {
      const d = parseEntryDate(r.date);
      return d >= range.start && d <= range.end;
    }).sort((a, b) => parseEntryDate(b.date) - parseEntryDate(a.date));

    if (rows.length === 0) {
      list.innerHTML = `<div class="day-card" style="text-align:center; color:var(--muted); padding:24px;">No expenses logged for this week.</div>`;
      document.getElementById('statTotal').innerText = "₹0";
      document.getElementById('statAvg').innerText = "₹0";
      document.getElementById('statDays').innerText = "0 Days";
      document.getElementById('statMax').innerText = "₹0";
      return;
    }

    let total = 0, max = 0;
    list.innerHTML = '';
    rows.forEach(r => {
      total += r.total;
      if (r.total > max) max = r.total;

      const card = document.createElement('div');
      card.className = 'day-card';
      card.innerHTML = `
        <div class="day-head">
          <span class="day-date">${r.date}</span>
          <span class="day-total">₹${r.total}</span>
        </div>
        <div class="meal-grid">
          <div class="meal-item"><span class="meal-lbl">Morning:</span><span class="meal-val">${r.morning}</span></div>
          <div class="meal-item"><span class="meal-lbl">Noon:</span><span class="meal-val">${r.noon}</span></div>
          <div class="meal-item"><span class="meal-lbl">Afternoon:</span><span class="meal-val">${r.afternoon}</span></div>
          <div class="meal-item"><span class="meal-lbl">Night:</span><span class="meal-val">${r.night}</span></div>
        </div>
        ${r.other && r.other !== "-" ? `<div class="other-line"><span class="meal-lbl">Other:</span><span class="meal-val">${r.other}</span></div>` : ''}
      `;
      list.appendChild(card);
    });

    document.getElementById('statTotal').innerText = `₹${total}`;
    document.getElementById('statAvg').innerText = `₹${Math.round(total / rows.length)}`;
    document.getElementById('statDays').innerText = `${rows.length} Days`;
    document.getElementById('statMax').innerText = `₹${max}`;
  }

  window.onload = () => {
    lastKnownDateKey = getTodayKey();
    applySavedTheme();
    fetchLiveReport();
    setInterval(fetchLiveReport, 30000);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        weekOffset = 0;
        fetchLiveReport();
      }
    });
  };
</script>
</body>
</html>
