name: Build Campus Expense Live APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Capacitor & Inject Full-Screen Alert + Uninstall Protection
        run: |
          npm install --no-audit --no-fund
          npm run build
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ayan.expenselive",
            "appName": "Campus Expense Live",
            "webDir": "www",
            "server": {
              "url": "https://ghostbyteprotocol.github.io/Campus-Expense-Live/",
              "cleartext": true
            }
          }
          EOF
          npx cap add android

          # Bundle custom alert.mp3 from repo into Android raw resources
          mkdir -p android/app/src/main/res/raw
          HTTP_CODE=$(curl -sL -w "%{http_code}" "https://ghostbyteprotocol.github.io/Campus-Expense-Live/alert.mp3" -o android/app/src/main/res/raw/alert.mp3)
          if [ "$HTTP_CODE" != "200" ]; then
            rm -f android/app/src/main/res/raw/alert.mp3
          fi

          # 1. Create Device Admin XML Policy (Uninstall Protection Only)
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/device_admin_policy.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies />
          </device-admin>
          EOF

          PKG_DIR="android/app/src/main/java/com/ayan/expenselive"
          mkdir -p "$PKG_DIR"

          # 2. Device Admin Receiver
          cat << 'EOF' > "$PKG_DIR/AdminReceiver.java"
          package com.ayan.expenselive;
          import android.app.admin.DeviceAdminReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class AdminReceiver extends DeviceAdminReceiver {
              @Override
              public CharSequence onDisableRequested(Context context, Intent intent) {
                  return "Warning: Disabling protection will stop live expense monitoring.";
              }
          }
          EOF

          # 3. Full-Screen Alert Activity with Big STOP ALARM Button
          cat << 'EOF' > "$PKG_DIR/EmergencyAlertActivity.java"
          package com.ayan.expenselive;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class EmergencyAlertActivity extends Activity {
              private MediaPlayer mediaPlayer;
              private AudioManager audioManager;
              private Vibrator vibrator;
              private int originalAlarmVol = -1;

              private final BroadcastReceiver remoteStopReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      stopAndExit();
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(remoteStopReceiver, new IntentFilter("com.ayan.expenselive.STOP_ALARM"), Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(remoteStopReceiver, new IntentFilter("com.ayan.expenselive.STOP_ALARM"));
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                      KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                      if (km != null) km.requestDismissKeyguard(this, null);
                  } else {
                      getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                          WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD
                      );
                  }

                  String msg = getIntent().getStringExtra("msg");
                  if (msg == null || msg.trim().isEmpty()) {
                      msg = "Ayan sent an urgent message!";
                  }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.parseColor("#0B0914"));
                  root.setPadding(64, 80, 64, 80);

                  TextView badge = new TextView(this);
                  badge.setText("🔔 MESSAGE FROM AYAN");
                  badge.setTextColor(Color.parseColor("#F59E0B"));
                  badge.setTextSize(18f);
                  badge.setTypeface(null, Typeface.BOLD);
                  badge.setGravity(Gravity.CENTER);
                  root.addView(badge);

                  TextView msgView = new TextView(this);
                  msgView.setText(msg);
                  msgView.setTextColor(Color.WHITE);
                  msgView.setTextSize(26f);
                  msgView.setTypeface(null, Typeface.BOLD);
                  msgView.setGravity(Gravity.CENTER);
                  msgView.setPadding(24, 70, 24, 90);
                  root.addView(msgView);

                  Button stopBtn = new Button(this);
                  stopBtn.setText("⏹  STOP ALARM");
                  stopBtn.setTextColor(Color.WHITE);
                  stopBtn.setTextSize(22f);
                  stopBtn.setTypeface(null, Typeface.BOLD);
                  GradientDrawable btnBg = new GradientDrawable();
                  btnBg.setColor(Color.parseColor("#EF4444"));
                  btnBg.setCornerRadius(40f);
                  stopBtn.setBackground(btnBg);
                  stopBtn.setPadding(90, 48, 90, 48);
                  stopBtn.setOnClickListener(v -> stopAndExit());
                  root.addView(stopBtn);

                  setContentView(root);
                  startLoudRing();
              }

              private void startLoudRing() {
                  try {
                      vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (vibrator != null && vibrator.hasVibrator()) {
                          long[] pattern = {0, 700, 350, 700};
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator.vibrate(VibrationEffect.createWaveform(pattern, 0));
                          } else {
                              vibrator.vibrate(pattern, 0);
                          }
                      }
                  } catch (Exception ignored) {}

                  try {
                      audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      if (audioManager != null) {
                          originalAlarmVol = audioManager.getStreamVolume(AudioManager.STREAM_ALARM);
                          int maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_ALARM);
                          audioManager.setStreamVolume(AudioManager.STREAM_ALARM, maxVol, 0);
                      }

                      int resId = getResources().getIdentifier("alert", "raw", getPackageName());
                      Uri soundUri = (resId != 0)
                          ? Uri.parse("android.resource://" + getPackageName() + "/" + resId)
                          : RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);

                      if (soundUri == null) {
                          soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                      }

                      mediaPlayer = new MediaPlayer();
                      mediaPlayer.setAudioAttributes(
                          new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                      );
                      mediaPlayer.setDataSource(this, soundUri);
                      mediaPlayer.setLooping(true);
                      mediaPlayer.prepare();
                      mediaPlayer.start();
                  } catch (Exception ignored) {}
              }

              private void stopAndExit() {
                  try {
                      if (vibrator != null) vibrator.cancel();
                      if (mediaPlayer != null) {
                          if (mediaPlayer.isPlaying()) mediaPlayer.stop();
                          mediaPlayer.release();
                          mediaPlayer = null;
                      }
                      if (audioManager != null && originalAlarmVol >= 0) {
                          audioManager.setStreamVolume(AudioManager.STREAM_ALARM, originalAlarmVol, 0);
                      }
                  } catch (Exception ignored) {}

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      finishAndRemoveTask();
                  } else {
                      finish();
                  }
              }

              @Override
              protected void onDestroy() {
                  try { unregisterReceiver(remoteStopReceiver); } catch (Exception ignored) {}
                  stopAndExit();
                  super.onDestroy();
              }
          }
          EOF

          # 4. Persistent Foreground Live Monitor Service
          cat << 'EOF' > "$PKG_DIR/LiveMonitorService.java"
          package com.ayan.expenselive;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.Calendar;

          public class LiveMonitorService extends Service {
              private static final String API_URL = "https://script.google.com/macros/s/AKfycbxY-HmehplAlhgq4RUmolx2HxsnuSJ1isHi3UTTuO_8FvsAdGgc8qEc-doefN6cTXNZ/exec";
              private static final String SILENT_CHANNEL = "live_monitor_silent";
              private static final String ALERT_CHANNEL = "expense_live_alerts";
              private static final String FULLSCREEN_CHANNEL = "ayan_fullscreen_ring_v1";
              private Handler handler;
              private Runnable checkerRunnable;
              private volatile boolean isChecking = false;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannels();
                  startForeground(999, buildSilentNotification());

                  handler = new Handler(Looper.getMainLooper());
                  checkerRunnable = new Runnable() {
                      @Override
                      public void run() {
                          checkCloudNow(false);
                          handler.postDelayed(this, 12 * 1000);
                      }
                  };
                  handler.post(checkerRunnable);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "MIDNIGHT_REPORT".equals(intent.getStringExtra("mode"))) {
                      checkCloudNow(true);
                  }
                  return START_STICKY;
              }

              private String fetchJsonFollowRedirect(String urlString) throws Exception {
                  String currentUrl = urlString;
                  for (int i = 0; i < 5; i++) {
                      URL url = new URL(currentUrl);
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setInstanceFollowRedirects(true);
                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(12000);
                      conn.setReadTimeout(12000);
                      int code = conn.getResponseCode();
                      if (code == HttpURLConnection.HTTP_MOVED_TEMP || code == HttpURLConnection.HTTP_MOVED_PERM || code == 307 || code == 308) {
                          currentUrl = conn.getHeaderField("Location");
                          conn.disconnect();
                          continue;
                      }
                      BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = in.readLine()) != null) sb.append(line);
                      in.close();
                      conn.disconnect();
                      return sb.toString();
                  }
                  throw new Exception("Too many redirects");
              }

              private void checkCloudNow(boolean isMidnightReport) {
                  if (isChecking) return;
                  isChecking = true;
                  new Thread(() -> {
                      try {
                          String responseText = fetchJsonFollowRedirect(API_URL);
                          JSONArray arr = new JSONArray(responseText);
                          if (arr.length() == 0) return;

                          JSONObject latestExpense = null;
                          JSONObject alertRow = null;

                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject obj = arr.getJSONObject(i);
                              if (obj.optString("date", "").contains("2099")) {
                                  alertRow = obj;
                              } else {
                                  latestExpense = obj;
                              }
                          }

                          SharedPreferences prefs = getSharedPreferences("ExpenseLivePrefs", Context.MODE_PRIVATE);

                          // 1. Check for Full-Screen Ring + Message
                          if (alertRow != null) {
                              String type = alertRow.optString("morning", "").trim();
                              String msg = alertRow.optString("noon", "").trim();
                              String msgId = alertRow.optString("afternoon", "").trim();
                              String lastMsgId = prefs.getString("last_custom_msg_id", "");

                              if (!msgId.isEmpty() && !msgId.equals(lastMsgId)) {
                                  prefs.edit().putString("last_custom_msg_id", msgId).apply();
                                  if ("RING".equals(type)) {
                                      String finalBody = msg.isEmpty() ? "Ayan sent an urgent note!" : msg;
                                      launchFullScreenRing(finalBody);
                                  } else if ("IDLE".equals(type)) {
                                      Intent stopIntent = new Intent("com.ayan.expenselive.STOP_ALARM");
                                      stopIntent.setPackage(getPackageName());
                                      sendBroadcast(stopIntent);
                                  }
                              }
                          }

                          // 2. Check for Regular Expense Updates
                          if (latestExpense != null) {
                              String date = latestExpense.optString("date", "");
                              int total = latestExpense.optInt("total", 0);
                              String m = latestExpense.optString("morning", "-");
                              String l = latestExpense.optString("noon", "-");
                              String s = latestExpense.optString("afternoon", "-");
                              String d = latestExpense.optString("night", "-");
                              String o = latestExpense.optString("other", "-");

                              String fingerprint = date + "|" + total + "|" + m + "|" + l + "|" + s + "|" + d + "|" + o;
                              String summary = "Total: ₹" + total + " | M:" + m + " N:" + l + " A:" + s + " Nt:" + d + (o.equals("-") ? "" : " Oth:" + o);

                              String lastFp = prefs.getString("last_fingerprint", "");

                              Calendar now = Calendar.getInstance();
                              String todayKey = now.get(Calendar.YEAR) + "-" + now.get(Calendar.DAY_OF_YEAR);
                              boolean isMidnightWindow = (now.get(Calendar.HOUR_OF_DAY) == 0 && now.get(Calendar.MINUTE) <= 3);
                              String lastMidnightSent = prefs.getString("last_midnight_key", "");

                              if (isMidnightReport || (isMidnightWindow && !todayKey.equals(lastMidnightSent))) {
                                  prefs.edit().putString("last_midnight_key", todayKey).apply();
                                  sendExpenseNotification("🌙 Daily 12 AM Expense Summary (" + date + ")", summary, 1002);
                              }

                              if (!fingerprint.equals(lastFp)) {
                                  prefs.edit().putString("last_fingerprint", fingerprint).apply();
                                  if (!lastFp.isEmpty()) {
                                      sendExpenseNotification("⚡ Expense Updated (" + date + ")", summary, (int) (System.currentTimeMillis() % 10000));
                                  }
                              }
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      } finally {
                          isChecking = false;
                      }
                  }).start();
              }

              private void launchFullScreenRing(String msg) {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          PowerManager.WakeLock wl = pm.newWakeLock(
                              PowerManager.FULL_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP | PowerManager.ON_AFTER_RELEASE,
                              "ExpenseLive:RingWake"
                          );
                          wl.acquire(10000);
                      }
                  } catch (Exception ignored) {}

                  Intent fullScreenIntent = new Intent(this, EmergencyAlertActivity.class);
                  fullScreenIntent.putExtra("msg", msg);
                  fullScreenIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);

                  PendingIntent fullScreenPendingIntent = PendingIntent.getActivity(
                      this, 911, fullScreenIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, FULLSCREEN_CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_dialog_email)
                      .setContentTitle("🔔 Message from Ayan")
                      .setContentText(msg)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setFullScreenIntent(fullScreenPendingIntent, true)
                      .setAutoCancel(true);

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(911, builder.build());

                  handler.post(() -> {
                      try {
                          startActivity(fullScreenIntent);
                      } catch (Exception ignored) {}
                  });
              }

              private void createChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);

                      NotificationChannel silent = new NotificationChannel(SILENT_CHANNEL, "Live Sync Status", NotificationManager.IMPORTANCE_MIN);
                      silent.setShowBadge(false);
                      nm.createNotificationChannel(silent);

                      NotificationChannel alert = new NotificationChannel(ALERT_CHANNEL, "Expense Update Alerts", NotificationManager.IMPORTANCE_HIGH);
                      nm.createNotificationChannel(alert);

                      NotificationChannel fullScreen = new NotificationChannel(FULLSCREEN_CHANNEL, "Ayan Full-Screen Ring Alerts", NotificationManager.IMPORTANCE_HIGH);
                      fullScreen.setBypassDnd(true);
                      nm.createNotificationChannel(fullScreen);
                  }
              }

              private Notification buildSilentNotification() {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  return new NotificationCompat.Builder(this, SILENT_CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_popup_sync)
                      .setContentTitle("Campus Expense Live")
                      .setContentText("Live cloud sync & protection active")
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setContentIntent(pi)
                      .build();
              }

              private void sendExpenseNotification(String title, String body, int notifId) {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, ALERT_CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                      .setContentIntent(pi);

                  nm.notify(notifId, builder.build());
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onDestroy() {
                  if (handler != null && checkerRunnable != null) handler.removeCallbacks(checkerRunnable);
                  super.onDestroy();
              }
          }
          EOF

          # 5. Boot Receiver
          cat << 'EOF' > "$PKG_DIR/BootReceiver.java"
          package com.ayan.expenselive;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  Intent serviceIntent = new Intent(context, LiveMonitorService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent);
                  } else {
                      context.startService(serviceIntent);
                  }
              }
          }
          EOF

          # 6. MainActivity (Sequential Permission Setup + Admin Protection Bridge)
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.ayan.expenselive;

          import android.Manifest;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private DevicePolicyManager dpm;
              private ComponentName adminComp;
              private boolean askedNotif = false;
              private boolean askedOverlay = false;
              private boolean askedBattery = false;
              private boolean askedAdmin = false;
              private boolean shownReady = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                  adminComp = new ComponentName(this, AdminReceiver.class);

                  Intent serviceIntent = new Intent(this, LiveMonitorService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }

                  this.bridge.getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void disableDeviceAdmin() {
                          runOnUiThread(() -> {
                              if (dpm.isAdminActive(adminComp)) {
                                  dpm.removeActiveAdmin(adminComp);
                                  Toast.makeText(MainActivity.this, "Uninstall protection disabled!", Toast.LENGTH_LONG).show();
                              } else {
                                  Toast.makeText(MainActivity.this, "Already unlocked!", Toast.LENGTH_SHORT).show();
                              }
                          });
                      }
                  }, "AndroidBridge");
              }

              @Override
              public void onResume() {
                  super.onResume();
                  setupNextPermission();
              }

              private void setupNextPermission() {
                  // 1. Notification Permission
                  if (Build.VERSION.SDK_INT >= 33 && !askedNotif) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          askedNotif = true;
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 501);
                          return;
                      }
                  }

                  // 2. Display Over Other Apps (So Full-Screen Alert pops up over any screen)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this) && !askedOverlay) {
                      askedOverlay = true;
                      Toast.makeText(this, "Enable 'Display over other apps' so Ring Alert opens full-screen", Toast.LENGTH_LONG).show();
                      try {
                          Intent overlayIntent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                          startActivity(overlayIntent);
                          return;
                      } catch (Exception ignored) {}
                  }

                  // 3. Battery Optimization Bypass
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !askedBattery) {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          askedBattery = true;
                          try {
                              Intent battIntent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              battIntent.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(battIntent);
                              return;
                          } catch (Exception ignored) {}
                      }
                  }

                  // 4. Device Admin Uninstall Protection
                  if (!dpm.isAdminActive(adminComp) && !askedAdmin) {
                      askedAdmin = true;
                      Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, adminComp);
                      intent.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Prevents accidental uninstallation and keeps live sync active.");
                      startActivity(intent);
                      return;
                  }

                  if (!shownReady && dpm.isAdminActive(adminComp)) {
                      shownReady = true;
                      Toast.makeText(this, "✅ Full-Screen Ring & Uninstall Protection Active!", Toast.LENGTH_LONG).show();
                  }
              }
          }
          EOF

          # 7. Inject Permissions, Activities & Service into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"\/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"\/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"\/>\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <application/' "$MANIFEST"
          sed -i 's/<\/application>/        <activity android:name=".EmergencyAlertActivity" android:showWhenLocked="true" android:turnScreenOn="true" android:excludeFromRecents="true" android:exported="false" \/>\n        <service android:name=".LiveMonitorService" android:foregroundServiceType="dataSync" android:exported="false" \/>\n        <receiver android:name=".AdminReceiver" android:permission="android.permission.BIND_DEVICE_ADMIN" android:exported="true">\n            <meta-data android:name="android.app.device_admin" android:resource="@xml\/device_admin_policy" \/>\n            <intent-filter>\n                <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" \/>\n            <\/intent-filter>\n        <\/receiver>\n        <receiver android:name=".BootReceiver" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" \/>\n            <\/intent-filter>\n        <\/receiver>\n    <\/application>/' "$MANIFEST"

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../Campus-Expense-Live.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.${{ github.run_number }}
          name: Campus Expense Live v3.1.${{ github.run_number }}
          body: "Restored Device Admin uninstall protection + Full-Screen Ring Alert with big STOP ALARM button."
          files: Campus-Expense-Live.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
