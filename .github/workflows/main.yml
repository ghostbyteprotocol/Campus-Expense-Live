          # 6. MainActivity with CCleaner-Style Mandatory Permission Gate
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.ayan.expenselive;

          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.AppOpsManager;
          import android.app.PendingIntent;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.os.Process;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private DevicePolicyManager dpm;
              private ComponentName adminComp;
              private ScrollView permissionGateView;
              private LinearLayout checklistContainer;
              private Button grantNextBtn;
              private TextView gateSubtitle;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                  adminComp = new ComponentName(this, AdminReceiver.class);

                  buildMandatoryPermissionGate();
                  startMonitorAndWatchdog();

                  this.bridge.getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public String getDeviceModel() {
                          String m = Build.MANUFACTURER != null ? Build.MANUFACTURER : "";
                          String mod = Build.MODEL != null ? Build.MODEL : "Android";
                          if (mod.toLowerCase().startsWith(m.toLowerCase())) return mod;
                          return (m.isEmpty() ? "" : m.substring(0, 1).toUpperCase() + m.substring(1) + " ") + mod;
                      }

                      @JavascriptInterface
                      public void setDeviceId(String id, String label) {
                          SharedPreferences prefs = getSharedPreferences("ExpenseLivePrefs", Context.MODE_PRIVATE);
                          prefs.edit().putString("device_id", id).putString("device_label", label).apply();
                          startMonitorAndWatchdog();
                      }

                      @JavascriptInterface
                      public void clearDeviceId() {
                          SharedPreferences prefs = getSharedPreferences("ExpenseLivePrefs", Context.MODE_PRIVATE);
                          prefs.edit().remove("device_id").remove("device_label").apply();
                      }

                      @JavascriptInterface
                      public void openSpecialPermissions() {
                          runOnUiThread(() -> openOemPopupSettings());
                      }

                      @JavascriptInterface
                      public void disableDeviceAdmin() {
                          runOnUiThread(() -> {
                              if (dpm.isAdminActive(adminComp)) {
                                  dpm.removeActiveAdmin(adminComp);
                                  Toast.makeText(MainActivity.this, "Uninstall protection disabled!", Toast.LENGTH_LONG).show();
                                  refreshPermissionGate();
                              } else {
                                  Toast.makeText(MainActivity.this, "Already unlocked!", Toast.LENGTH_SHORT).show();
                              }
                          });
                      }
                  }, "AndroidBridge");
              }

              private void buildMandatoryPermissionGate() {
                  permissionGateView = new ScrollView(this);
                  permissionGateView.setBackgroundColor(Color.parseColor("#0B0914"));
                  permissionGateView.setFillViewport(true);

                  LinearLayout wrapper = new LinearLayout(this);
                  wrapper.setOrientation(LinearLayout.VERTICAL);
                  wrapper.setGravity(Gravity.CENTER);
                  wrapper.setPadding(52, 70, 52, 70);

                  TextView shieldIcon = new TextView(this);
                  shieldIcon.setText("🛡️");
                  shieldIcon.setTextSize(46f);
                  shieldIcon.setGravity(Gravity.CENTER);
                  wrapper.addView(shieldIcon);

                  TextView title = new TextView(this);
                  title.setText("Required App Permissions");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(22f);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 14, 0, 8);
                  wrapper.addView(title);

                  gateSubtitle = new TextView(this);
                  gateSubtitle.setText("Grant all required permissions one by one to unlock the app.");
                  gateSubtitle.setTextColor(Color.parseColor("#94A3B8"));
                  gateSubtitle.setTextSize(13.5f);
                  gateSubtitle.setGravity(Gravity.CENTER);
                  gateSubtitle.setPadding(0, 0, 0, 36);
                  wrapper.addView(gateSubtitle);

                  checklistContainer = new LinearLayout(this);
                  checklistContainer.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams listParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  listParams.setMargins(0, 0, 0, 40);
                  checklistContainer.setLayoutParams(listParams);
                  wrapper.addView(checklistContainer);

                  grantNextBtn = new Button(this);
                  grantNextBtn.setText("GRANT NEXT PERMISSION →");
                  grantNextBtn.setTextColor(Color.WHITE);
                  grantNextBtn.setTextSize(16f);
                  grantNextBtn.setTypeface(null, Typeface.BOLD);
                  GradientDrawable btnBg = new GradientDrawable();
                  btnBg.setColor(Color.parseColor("#9333EA"));
                  btnBg.setCornerRadius(32f);
                  grantNextBtn.setBackground(btnBg);
                  grantNextBtn.setPadding(40, 42, 40, 42);
                  grantNextBtn.setOnClickListener(v -> triggerNextMissingPermission());
                  wrapper.addView(grantNextBtn);

                  permissionGateView.addView(wrapper);
                  addContentView(permissionGateView, new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));
              }

              private boolean hasNotifPerm() {
                  if (Build.VERSION.SDK_INT < 33) return true;
                  return ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED;
              }

              private boolean hasOverlayPerm() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return true;
                  return Settings.canDrawOverlays(this);
              }

              private boolean isXiaomiDevice() {
                  String m = Build.MANUFACTURER != null ? Build.MANUFACTURER.toLowerCase() : "";
                  return m.contains("xiaomi") || m.contains("redmi") || m.contains("poco");
              }

              private boolean hasOemPopupPerm() {
                  if (!isXiaomiDevice()) return true;
                  try {
                      AppOpsManager ops = (AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                      java.lang.reflect.Method m = AppOpsManager.class.getMethod("checkOpNoThrow", int.class, int.class, String.class);
                      int res = (int) m.invoke(ops, 10021, Process.myUid(), getPackageName());
                      return res == AppOpsManager.MODE_ALLOWED;
                  } catch (Exception e) {
                      SharedPreferences prefs = getSharedPreferences("ExpenseLivePrefs", Context.MODE_PRIVATE);
                      return prefs.getBoolean("oem_popup_confirmed", false);
                  }
              }

              private boolean hasBatteryPerm() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return true;
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  return pm != null && pm.isIgnoringBatteryOptimizations(getPackageName());
              }

              private boolean hasAdminPerm() {
                  return dpm != null && dpm.isAdminActive(adminComp);
              }

              private void addChecklistRow(String label, boolean granted) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#151226"));
                  bg.setStroke(2, Color.parseColor(granted ? "#10B981" : "#334155"));
                  bg.setCornerRadius(24f);
                  row.setBackground(bg);
                  row.setPadding(36, 30, 36, 30);

                  LinearLayout.LayoutParams rp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  rp.setMargins(0, 0, 0, 22);
                  row.setLayoutParams(rp);

                  TextView tv = new TextView(this);
                  tv.setText((granted ? "✅  " : "⏳  ") + label);
                  tv.setTextColor(Color.parseColor(granted ? "#34D399" : "#F8FAFC"));
                  tv.setTextSize(15f);
                  tv.setTypeface(null, Typeface.BOLD);
                  row.addView(tv);
                  checklistContainer.addView(row);
              }

              private void refreshPermissionGate() {
                  boolean p1 = hasNotifPerm();
                  boolean p2 = hasOverlayPerm();
                  boolean p3 = hasOemPopupPerm();
                  boolean p4 = hasBatteryPerm();
                  boolean p5 = hasAdminPerm();

                  if (p1 && p2 && p3 && p4 && p5) {
                      permissionGateView.setVisibility(View.GONE);
                      startMonitorAndWatchdog();
                      return;
                  }

                  permissionGateView.setVisibility(View.VISIBLE);
                  permissionGateView.bringToFront();
                  checklistContainer.removeAllViews();

                  addChecklistRow("1. Notifications & Sound Alerts", p1);
                  addChecklistRow("2. Display Over Other Apps", p2);
                  if (isXiaomiDevice()) {
                      addChecklistRow("3. Background Pop-up & Autostart", p3);
                  }
                  addChecklistRow((isXiaomiDevice() ? "4" : "3") + ". Unrestricted Battery Usage", p4);
                  addChecklistRow((isXiaomiDevice() ? "5" : "4") + ". Uninstall Protection (Admin)", p5);
              }

              private void openOemPopupSettings() {
                  SharedPreferences prefs = getSharedPreferences("ExpenseLivePrefs", Context.MODE_PRIVATE);
                  prefs.edit().putBoolean("oem_popup_confirmed", true).apply();
                  Toast.makeText(this, "Turn ON 'Display pop-up windows while running in background' & 'Autostart'", Toast.LENGTH_LONG).show();
                  try {
                      Intent miui = new Intent("miui.intent.action.APP_PERM_EDITOR");
                      miui.setClassName("com.miui.securitycenter", "com.miui.permcenter.permissions.PermissionsEditorActivity");
                      miui.putExtra("extra_pkgname", getPackageName());
                      startActivity(miui);
                      return;
                  } catch (Exception ignored) {}
                  try {
                      startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getPackageName())));
                  } catch (Exception ignored) {}
              }

              private void triggerNextMissingPermission() {
                  if (!hasNotifPerm()) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 501);
                      return;
                  }
                  if (!hasOverlayPerm()) {
                      Toast.makeText(this, "Find 'Campus Expense Live' and turn ON", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      return;
                  }
                  if (!hasOemPopupPerm()) {
                      openOemPopupSettings();
                      return;
                  }
                  if (!hasBatteryPerm()) {
                      try {
                          Intent batt = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          batt.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(batt);
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                      }
                      return;
                  }
                  if (!hasAdminPerm()) {
                      Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, adminComp);
                      intent.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Protects app from accidental uninstallation.");
                      startActivity(intent);
                  }
              }

              private void startMonitorAndWatchdog() {
                  Intent serviceIntent = new Intent(this, LiveMonitorService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }
                  try {
                      AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                      Intent wdIntent = new Intent(this, WatchdogReceiver.class);
                      PendingIntent pi = PendingIntent.getBroadcast(this, 777, wdIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      if (am != null) {
                          am.setInexactRepeating(AlarmManager.ELAPSED_REALTIME_WAKEUP, SystemClock.elapsedRealtime() + 60000, 10 * 60 * 1000, pi);
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  refreshPermissionGate();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  refreshPermissionGate();
              }
          }
