name: Build Campus Expense Live APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Capacitor & Inject Mandatory Permission Gate + Service Alarm + Pre-Cached Custom Audio
        run: |
          npm install --no-audit --no-fund
          npm run build
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.ayan.expenselive",
            "appName": "Campus Expense Live",
            "webDir": "www",
            "server": {
              "url": "https://ghostbyteprotocol.github.io/Campus-Expense-Live/",
              "cleartext": true
            }
          }
          EOF
          npx cap add android

          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

          mkdir -p android/app/src/main/res/raw
          HTTP_CODE=$(curl -sL -w "%{http_code}" "https://ghostbyteprotocol.github.io/Campus-Expense-Live/alert.mp3" -o android/app/src/main/res/raw/alert.mp3)
          if [ "$HTTP_CODE" != "200" ]; then
            rm -f android/app/src/main/res/raw/alert.mp3
          fi

          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/device_admin_policy.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies />
          </device-admin>
          EOF

          PKG_DIR="android/app/src/main/java/com/ayan/expenselive"
          mkdir -p "$PKG_DIR"

          # 1. Device Admin Receiver
          cat << 'EOF' > "$PKG_DIR/AdminReceiver.java"
          package com.ayan.expenselive;
          import android.app.admin.DeviceAdminReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class AdminReceiver extends DeviceAdminReceiver {
              @Override
              public CharSequence onDisableRequested(Context context, Intent intent) {
                  return "Warning: Disabling protection will stop live expense monitoring.";
              }
          }
          EOF

          # 2. Notification Stop Action Receiver
          cat << 'EOF' > "$PKG_DIR/StopAlarmReceiver.java"
          package com.ayan.expenselive;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class StopAlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  Intent stopSvc = new Intent(context, LiveMonitorService.class);
                  stopSvc.setAction("ACTION_STOP_ALARM");
                  context.startService(stopSvc);
              }
          }
          EOF

          # 3. Full-Screen Alert UI Activity (Synced with Service Audio & Volume Lock)
          cat << 'EOF' > "$PKG_DIR/EmergencyAlertActivity.java"
          package com.ayan.expenselive;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class EmergencyAlertActivity extends Activity {
              private final BroadcastReceiver closeUiReceiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      closeScreen();
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(closeUiReceiver, new IntentFilter("com.ayan.expenselive.CLOSE_ALERT_UI"), Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(closeUiReceiver, new IntentFilter("com.ayan.expenselive.CLOSE_ALERT_UI"));
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                      KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                      if (km != null) km.requestDismissKeyguard(this, null);
                  } else {
                      getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                          WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD
                      );
                  }

                  String msg = getIntent().getStringExtra("msg");
                  if (msg == null || msg.trim().isEmpty()) {
                      msg = "Priority Alert! Please check.";
                  }
                  int volumePct = getIntent().getIntExtra("volume", 100);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.parseColor("#0B0914"));
                  root.setPadding(56, 70, 56, 70);

                  TextView appHeader = new TextView(this);
                  appHeader.setText("🎓 CAMPUS EXPENSE LIVE");
                  appHeader.setTextColor(Color.parseColor("#A855F7"));
                  appHeader.setTextSize(14f);
                  appHeader.setTypeface(null, Typeface.BOLD);
                  appHeader.setGravity(Gravity.CENTER);
                  appHeader.setPadding(0, 0, 0, 28);
                  root.addView(appHeader);

                  TextView senderName = new TextView(this);
                  senderName.setText("AYAN KARMAKAR");
                  senderName.setTextColor(Color.parseColor("#F59E0B"));
                  senderName.setTextSize(25f);
                  senderName.setTypeface(null, Typeface.BOLD);
                  senderName.setGravity(Gravity.CENTER);
                  root.addView(senderName);

                  TextView subLabel = new TextView(this);
                  subLabel.setText("Priority Notice • Locked Volume " + volumePct + "%");
                  subLabel.setTextColor(Color.parseColor("#CBD5E1"));
                  subLabel.setTextSize(15f);
                  subLabel.setGravity(Gravity.CENTER);
                  subLabel.setPadding(0, 10, 0, 50);
                  root.addView(subLabel);

                  TextView msgView = new TextView(this);
                  msgView.setText(msg);
                  msgView.setTextColor(Color.WHITE);
                  msgView.setTextSize(24f);
                  msgView.setTypeface(null, Typeface.BOLD);
                  msgView.setGravity(Gravity.CENTER);
                  GradientDrawable cardBg = new GradientDrawable();
                  cardBg.setColor(Color.parseColor("#18142B"));
                  cardBg.setStroke(3, Color.parseColor("#F59E0B"));
                  cardBg.setCornerRadius(32f);
                  msgView.setBackground(cardBg);
                  msgView.setPadding(44, 52, 44, 52);

                  LinearLayout.LayoutParams msgParams = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  msgParams.setMargins(0, 0, 0, 75);
                  msgView.setLayoutParams(msgParams);
                  root.addView(msgView);

                  Button stopBtn = new Button(this);
                  stopBtn.setText("⏹  STOP ALARM");
                  stopBtn.setTextColor(Color.WHITE);
                  stopBtn.setTextSize(22f);
                  stopBtn.setTypeface(null, Typeface.BOLD);
                  GradientDrawable btnBg = new GradientDrawable();
                  btnBg.setColor(Color.parseColor("#EF4444"));
                  btnBg.setCornerRadius(40f);
                  stopBtn.setBackground(btnBg);
                  stopBtn.setPadding(90, 48, 90, 48);
                  stopBtn.setOnClickListener(v -> {
                      Intent stopSvc = new Intent(this, LiveMonitorService.class);
                      stopSvc.setAction("ACTION_STOP_ALARM");
                      startService(stopSvc);
                      closeScreen();
                  });
                  root.addView(stopBtn);

                  setContentView(root);
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  if (code == KeyEvent.KEYCODE_VOLUME_DOWN || code == KeyEvent.KEYCODE_VOLUME_UP || code == KeyEvent.KEYCODE_VOLUME_MUTE) {
                      return true;
                  }
                  return super.dispatchKeyEvent(event);
              }

              @Override
              public void onBackPressed() {
                  // Must press STOP ALARM button
              }

              private void closeScreen() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      finishAndRemoveTask();
                  } else {
                      finish();
                  }
              }

              @Override
              protected void onDestroy() {
                  try { unregisterReceiver(closeUiReceiver); } catch (Exception ignored) {}
                  super.onDestroy();
              }
          }
          EOF

          # 4. Persistent Service (Immediate Background Audio Ring + Volume Lock + Pre-Cached Custom Ringtone)
          cat << 'EOF' > "$PKG_DIR/LiveMonitorService.java"
          package com.ayan.expenselive;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.util.Base64;
          import androidx.core.app.NotificationCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.json.JSONTokener;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;

          public class LiveMonitorService extends Service {
              private static final String FB_DB = "https://campus-expense-pro-default-rtdb.firebaseio.com";
              private static final String SHEET_API = "https://script.google.com/macros/s/AKfycbxY-HmehplAlhgq4RUmolx2HxsnuSJ1isHi3UTTuO_8FvsAdGgc8qEc-doefN6cTXNZ/exec";
              private static final String SILENT_CHANNEL = "live_monitor_silent";
              private static final String ALERT_CHANNEL = "expense_live_alerts_v2";
              private static final String FULLSCREEN_CHANNEL = "ayan_fullscreen_ring_v5";

              private Handler handler;
              private Runnable fbChecker;
              private Runnable sheetChecker;
              private Runnable volEnforcer;

              private volatile boolean isFbChecking = false;
              private volatile boolean isAudioSyncing = false;
              private volatile boolean isAlarmPlaying = false;

              private MediaPlayer activePlayer;
              private AudioManager audioManager;
              private Vibrator activeVibrator;
              private int originalAlarmVol = -1;
              private int lockedTargetVol = -1;
              private String currentRingingAlertId = "";

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannels();
                  startForeground(999, buildSilentNotification());

                  handler = new Handler(Looper.getMainLooper());

                  fbChecker = new Runnable() {
                      @Override
                      public void run() {
                          checkFirebaseRealtime();
                          handler.postDelayed(this, 3500);
                      }
                  };
                  handler.post(fbChecker);

                  sheetChecker = new Runnable() {
                      @Override
                      public void run() {
                          checkSheetExpense();
                          handler.postDelayed(this, 30000);
                      }
                  };
                  handler.postDelayed(sheetChecker, 5000);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "ACTION_STOP_ALARM".equals(intent.getAction())) {
                      stopAlarmAndReportSeen();
                      return START_STICKY;
                  }
                  checkFirebaseRealtime();
                  return START_STICKY;
              }

              private String httpGet(String urlStr) throws Exception {
                  String current = urlStr;
                  for (int i = 0; i < 4; i++) {
                      HttpURLConnection conn = (HttpURLConnection) new URL(current).openConnection();
                      conn.setInstanceFollowRedirects(true);
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(25000);
                      int code = conn.getResponseCode();
                      if (code == 301 || code == 302 || code == 307 || code == 308) {
                          current = conn.getHeaderField("Location");
                          conn.disconnect();
                          continue;
                      }
                      BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line);
                      br.close();
                      conn.disconnect();
                      return sb.toString();
                  }
                  return "";
              }

              private void httpPutJson(String urlStr, String jsonBody) {
                  try {
                      HttpURLConnection conn = (HttpURLConnection) new URL(urlStr).openConnection();
                      conn.setRequestMethod("PUT");
                      conn.setRequestProperty("Content-Type", "application/json");
                      conn.setDoOutput(true);
                      conn.setConnectTimeout(8000);
                      OutputStream os = conn.getOutputStream();
                      os.write(jsonBody.getBytes(StandardCharsets.UTF_8));
                      os.close();
                      conn.getResponseCode();
                      conn.disconnect();
                  } catch (Exception ignored) {}
              }

              // Pre-downloads and permanently caches custom audio in getFilesDir() as soon as uploaded
              private void syncCustomAudioIfUpdated(String deviceId, SharedPreferences prefs) {
                  if (isAudioSyncing) return;
                  isAudioSyncing = true;
                  try {
                      String scope = deviceId;
                      String metaRaw = httpGet(FB_DB + "/device_audio/" + scope + "/meta.json");
                      if (metaRaw == null || metaRaw.trim().equals("null") || metaRaw.trim().isEmpty()) {
                          scope = "ALL";
                          metaRaw = httpGet(FB_DB + "/device_audio/ALL/meta.json");
                      }

                      File savedAudio = new File(getFilesDir(), "custom_ring.dat");
                      if (metaRaw == null || metaRaw.trim().equals("null") || metaRaw.trim().isEmpty()) {
                          // Check legacy single-node format if any
                          String legacyRaw = httpGet(FB_DB + "/device_audio/" + deviceId + ".json");
                          if (legacyRaw == null || legacyRaw.trim().equals("null") || !legacyRaw.contains("base64")) {
                              legacyRaw = httpGet(FB_DB + "/device_audio/ALL.json");
                          }
                          if (legacyRaw != null && legacyRaw.contains("base64")) {
                              JSONObject legObj = new JSONObject(legacyRaw);
                              long legTs = legObj.optLong("updatedAt", 1);
                              if (prefs.getLong("cached_custom_audio_ts", -1) != legTs || !savedAudio.exists()) {
                                  String b64 = legObj.optString("base64", "");
                                  if (b64.contains(",")) b64 = b64.substring(b64.indexOf(",") + 1);
                                  b64 = b64.replaceAll("[^A-Za-z0-9+/=]", "");
                                  byte[] bytes = Base64.decode(b64, Base64.DEFAULT);
                                  FileOutputStream fos = new FileOutputStream(savedAudio);
                                  fos.write(bytes);
                                  fos.flush();
                                  fos.close();
                                  prefs.edit().putLong("cached_custom_audio_ts", legTs).apply();
                              }
                          }
                          return;
                      }

                      JSONObject meta = new JSONObject(metaRaw);
                      long updatedAt = meta.optLong("updatedAt", 0);
                      int totalChunks = meta.optInt("totalChunks", 0);
                      String fileName = meta.optString("name", "custom.mp3");
                      if (totalChunks <= 0) return;

                      if (prefs.getLong("cached_custom_audio_ts", -1) == updatedAt && savedAudio.exists() && savedAudio.length() > 100) {
                          return;
                      }

                      File tmpFile = new File(getFilesDir(), "custom_ring_tmp.dat");
                      FileOutputStream fos = new FileOutputStream(tmpFile);
                      for (int i = 0; i < totalChunks; i++) {
                          String chunkRaw = httpGet(FB_DB + "/device_audio/" + scope + "/chunks/" + i + ".json");
                          if (chunkRaw == null || chunkRaw.trim().equals("null") || chunkRaw.trim().isEmpty()) {
                              fos.close();
                              return;
                          }
                          Object val = new JSONTokener(chunkRaw).nextValue();
                          String b64 = String.valueOf(val);
                          if (b64.contains(",")) b64 = b64.substring(b64.indexOf(",") + 1);
                          b64 = b64.replaceAll("[^A-Za-z0-9+/=]", "");
                          byte[] decoded = Base64.decode(b64, Base64.DEFAULT);
                          fos.write(decoded);
                      }
                      fos.flush();
                      fos.close();

                      if (tmpFile.exists() && tmpFile.length() > 100) {
                          if (savedAudio.exists()) savedAudio.delete();
                          tmpFile.renameTo(savedAudio);
                          prefs.edit().putLong("cached_custom_audio_ts", updatedAt).apply();
                          httpPutJson(FB_DB + "/devices/" + deviceId + "/syncedAudio.json", "\"" + fileName.replace("\"", "") + "\"");
                      }
                  } catch (Exception ignored) {
                  } finally {
                      isAudioSyncing = false;
                  }
              }

              private void startImmediateServiceRing(String alertId, int volumePct, boolean wantCustomAudio) {
                  stopMediaAndVibrationOnly();
                  currentRingingAlertId = alertId;
                  isAlarmPlaying = true;

                  try {
                      activeVibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (activeVibrator != null && activeVibrator.hasVibrator()) {
                          long[] pattern = {0, 750, 350, 750};
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              activeVibrator.vibrate(VibrationEffect.createWaveform(pattern, 0));
                          } else {
                              activeVibrator.vibrate(pattern, 0);
                          }
                      }
                  } catch (Exception ignored) {}

                  if (volumePct <= 0) {
                      lockedTargetVol = 0;
                      return;
                  }

                  try {
                      audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      if (audioManager != null) {
                          originalAlarmVol = audioManager.getStreamVolume(AudioManager.STREAM_ALARM);
                          int maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_ALARM);
                          int clamped = Math.max(1, Math.min(100, volumePct));
                          lockedTargetVol = Math.max(1, Math.round((clamped / 100.0f) * maxVol));
                          audioManager.setStreamVolume(AudioManager.STREAM_ALARM, lockedTargetVol, 0);

                          volEnforcer = new Runnable() {
                              @Override
                              public void run() {
                                  if (!isAlarmPlaying) return;
                                  try {
                                      if (audioManager.getStreamVolume(AudioManager.STREAM_ALARM) != lockedTargetVol) {
                                          audioManager.setStreamVolume(AudioManager.STREAM_ALARM, lockedTargetVol, 0);
                                      }
                                  } catch (Exception ignored) {}
                                  handler.postDelayed(this, 200);
                              }
                          };
                          handler.postDelayed(volEnforcer, 200);
                      }

                      activePlayer = new MediaPlayer();
                      activePlayer.setAudioAttributes(
                          new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                      );

                      boolean customLoaded = false;
                      if (wantCustomAudio) {
                          File customFile = new File(getFilesDir(), "custom_ring.dat");
                          if (customFile.exists() && customFile.length() > 100) {
                              try {
                                  activePlayer.setDataSource(customFile.getAbsolutePath());
                                  activePlayer.setLooping(true);
                                  activePlayer.prepare();
                                  activePlayer.start();
                                  customLoaded = true;
                              } catch (Exception e) {
                                  activePlayer.reset();
                              }
                          }
                      }

                      if (!customLoaded) {
                          int resId = getResources().getIdentifier("alert", "raw", getPackageName());
                          Uri soundUri = (resId != 0)
                              ? Uri.parse("android.resource://" + getPackageName() + "/" + resId)
                              : RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                          if (soundUri == null) {
                              soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                          }
                          activePlayer.setDataSource(this, soundUri);
                          activePlayer.setLooping(true);
                          activePlayer.prepare();
                          activePlayer.start();
                      }
                  } catch (Exception ignored) {}
              }

              private void stopMediaAndVibrationOnly() {
                  isAlarmPlaying = false;
                  if (handler != null && volEnforcer != null) {
                      handler.removeCallbacks(volEnforcer);
                  }
                  try {
                      if (activeVibrator != null) {
                          activeVibrator.cancel();
                          activeVibrator = null;
                      }
                      if (activePlayer != null) {
                          if (activePlayer.isPlaying()) activePlayer.stop();
                          activePlayer.release();
                          activePlayer = null;
                      }
                      if (audioManager != null && originalAlarmVol >= 0) {
                          audioManager.setStreamVolume(AudioManager.STREAM_ALARM, originalAlarmVol, 0);
                          originalAlarmVol = -1;
                      }
                  } catch (Exception ignored) {}
              }

              private void stopAlarmAndReportSeen() {
                  stopMediaAndVibrationOnly();
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.cancel(911);

                  Intent closeUi = new Intent("com.ayan.expenselive.CLOSE_ALERT_UI");
                  closeUi.setPackage(getPackageName());
                  sendBroadcast(closeUi);

                  SharedPreferences prefs = getSharedPreferences("ExpenseLivePrefs", Context.MODE_PRIVATE);
                  String deviceId = prefs.getString("device_id", "");
                  String deviceLabel = prefs.getString("device_label", Build.MODEL);
                  String alId = currentRingingAlertId;
                  currentRingingAlertId = "";

                  if (!deviceId.isEmpty() && !alId.isEmpty()) {
                      new Thread(() -> {
                          try {
                              JSONObject body = new JSONObject();
                              body.put("state", "seen");
                              body.put("deviceLabel", deviceLabel);
                              body.put("updatedAt", System.currentTimeMillis());
                              httpPutJson(FB_DB + "/alert_status/" + alId + "/" + deviceId + ".json", body.toString());
                          } catch (Exception ignored) {}
                      }).start();
                  }
              }

              private void checkFirebaseRealtime() {
                  if (isFbChecking) return;
                  SharedPreferences prefs = getSharedPreferences("ExpenseLivePrefs", Context.MODE_PRIVATE);
                  String deviceId = prefs.getString("device_id", "");
                  String deviceLabel = prefs.getString("device_label", Build.MODEL);
                  if (deviceId.isEmpty()) return;

                  isFbChecking = true;
                  new Thread(() -> {
                      try {
                          String devRaw = httpGet(FB_DB + "/devices/" + deviceId + ".json");
                          if (devRaw != null && (devRaw.trim().equals("null") || devRaw.contains("\"kicked\""))) {
                              prefs.edit().remove("device_id").remove("device_label").apply();
                              return;
                          }

                          // Keep custom audio pre-cached in background
                          syncCustomAudioIfUpdated(deviceId, prefs);

                          // Check instant expense update notification
                          try {
                              String expRaw = httpGet(FB_DB + "/latest_expense_notif.json");
                              if (expRaw != null && !expRaw.trim().equals("null") && !expRaw.trim().isEmpty()) {
                                  JSONObject expObj = new JSONObject(expRaw);
                                  String expId = expObj.optString("id", "");
                                  long ts = expObj.optLong("timestamp", 0);
                                  String lastExpId = prefs.getString("last_fb_exp_notif_id", "");
                                  if (!expId.isEmpty() && !expId.equals(lastExpId) && (System.currentTimeMillis() - ts < 300000)) {
                                      prefs.edit().putString("last_fb_exp_notif_id", expId).apply();
                                      sendExpenseNotification(
                                          expObj.optString("title", "⚡ Expense Updated"),
                                          expObj.optString("body", "Tap to view details"),
                                          (int)(System.currentTimeMillis() % 10000) + 2000
                                      );
                                  }
                              }
                          } catch (Exception ignored) {}

                          // Check Priority Ring Alert
                          String alertRaw = httpGet(FB_DB + "/active_alert.json");
                          if (alertRaw == null || alertRaw.trim().equals("null") || alertRaw.trim().isEmpty()) return;

                          JSONObject alertObj = new JSONObject(alertRaw);
                          String status = alertObj.optString("status", "");
                          String alertId = alertObj.optString("id", "");
                          String target = alertObj.optString("target", "ALL");
                          String msg = alertObj.optString("msg", "Priority Alert!");
                          int volume = alertObj.optInt("volume", 100);
                          boolean wantCustomAudio = alertObj.optBoolean("useCustomAudio", true);

                          String lastAlertId = prefs.getString("last_fb_alert_id", "");

                          if ("active".equals(status) && !alertId.isEmpty() && !alertId.equals(lastAlertId)) {
                              if ("ALL".equals(target) || deviceId.equals(target)) {
                                  prefs.edit().putString("last_fb_alert_id", alertId).apply();

                                  // 1. Start ringing IMMEDIATELY inside the Service (no tap needed!)
                                  handler.post(() -> startImmediateServiceRing(alertId, volume, wantCustomAudio));

                                  // 2. Report ringing status
                                  JSONObject st = new JSONObject();
                                  st.put("state", "ringing");
                                  st.put("deviceLabel", deviceLabel);
                                  st.put("updatedAt", System.currentTimeMillis());
                                  httpPutJson(FB_DB + "/alert_status/" + alertId + "/" + deviceId + ".json", st.toString());

                                  // 3. Launch Full-Screen UI + Notification with STOP button
                                  launchFullScreenRing(alertId, msg, volume);
                              }
                          } else if ("stopped".equals(status) && !alertId.equals(prefs.getString("last_stopped_id", ""))) {
                              prefs.edit().putString("last_stopped_id", alertId).apply();
                              handler.post(this::stopAlarmAndReportSeen);
                          }
                      } catch (Exception ignored) {
                      } finally {
                          isFbChecking = false;
                      }
                  }).start();
              }

              private void checkSheetExpense() {
                  new Thread(() -> {
                      try {
                          String res = httpGet(SHEET_API);
                          JSONArray arr = new JSONArray(res);
                          JSONObject latest = null;
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject o = arr.getJSONObject(i);
                              if (!o.optString("date", "").contains("2099") && !o.optString("date", "").contains("__SYS_CMD__")) {
                                  latest = o;
                              }
                          }
                          if (latest != null) {
                              String date = latest.optString("date", "");
                              int total = latest.optInt("total", 0);
                              String fp = date + "|" + total + "|" + latest.optString("morning") + "|" + latest.optString("noon") + "|" + latest.optString("afternoon") + "|" + latest.optString("night") + "|" + latest.optString("other");
                              SharedPreferences prefs = getSharedPreferences("ExpenseLivePrefs", Context.MODE_PRIVATE);
                              String lastFp = prefs.getString("last_fingerprint", "");
                              if (!fp.equals(lastFp)) {
                                  prefs.edit().putString("last_fingerprint", fp).apply();
                              }
                          }
                      } catch (Exception ignored) {}
                  }).start();
              }

              private void launchFullScreenRing(String alertId, String msg, int volume) {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          PowerManager.WakeLock wl = pm.newWakeLock(
                              PowerManager.FULL_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP | PowerManager.ON_AFTER_RELEASE,
                              "ExpenseLive:RingWake"
                          );
                          wl.acquire(10000);
                      }
                  } catch (Exception ignored) {}

                  Intent fullScreenIntent = new Intent(this, EmergencyAlertActivity.class);
                  fullScreenIntent.putExtra("alertId", alertId);
                  fullScreenIntent.putExtra("msg", msg);
                  fullScreenIntent.putExtra("volume", volume);
                  fullScreenIntent.addFlags(
                      Intent.FLAG_ACTIVITY_NEW_TASK |
                      Intent.FLAG_ACTIVITY_CLEAR_TOP |
                      Intent.FLAG_ACTIVITY_SINGLE_TOP |
                      Intent.FLAG_ACTIVITY_REORDER_TO_FRONT
                  );

                  PendingIntent fullScreenPendingIntent = PendingIntent.getActivity(
                      this, 911, fullScreenIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Intent stopActionIntent = new Intent(this, StopAlarmReceiver.class);
                  PendingIntent stopPendingIntent = PendingIntent.getBroadcast(
                      this, 912, stopActionIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, FULLSCREEN_CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_dialog_email)
                      .setContentTitle("🔔 Ayan Karmakar")
                      .setContentText(msg)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setOngoing(true)
                      .setFullScreenIntent(fullScreenPendingIntent, true)
                      .addAction(android.R.drawable.ic_media_pause, "⏹ STOP ALARM", stopPendingIntent);

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(911, builder.build());

                  handler.post(() -> {
                      try { startActivity(fullScreenIntent); } catch (Exception ignored) {}
                  });
              }

              private void createChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      NotificationChannel silent = new NotificationChannel(SILENT_CHANNEL, "Live Sync Status", NotificationManager.IMPORTANCE_MIN);
                      silent.setShowBadge(false);
                      nm.createNotificationChannel(silent);

                      NotificationChannel alert = new NotificationChannel(ALERT_CHANNEL, "Expense Update Notifications", NotificationManager.IMPORTANCE_HIGH);
                      alert.enableVibration(true);
                      nm.createNotificationChannel(alert);

                      NotificationChannel fullScreen = new NotificationChannel(FULLSCREEN_CHANNEL, "Priority Ring Alerts", NotificationManager.IMPORTANCE_HIGH);
                      fullScreen.setBypassDnd(true);
                      fullScreen.setSound(null, null); // Service plays custom alarm stream directly
                      nm.createNotificationChannel(fullScreen);
                  }
              }

              private Notification buildSilentNotification() {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  return new NotificationCompat.Builder(this, SILENT_CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_popup_sync)
                      .setContentTitle("Campus Expense Live")
                      .setContentText("Live cloud sync & watchdog active")
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setContentIntent(pi)
                      .build();
              }

              private void sendExpenseNotification(String title, String body, int notifId) {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, ALERT_CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                      .setContentIntent(pi);

                  nm.notify(notifId, builder.build());
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onDestroy() {
                  stopMediaAndVibrationOnly();
                  if (handler != null) {
                      handler.removeCallbacks(fbChecker);
                      handler.removeCallbacks(sheetChecker);
                  }
                  super.onDestroy();
              }
          }
